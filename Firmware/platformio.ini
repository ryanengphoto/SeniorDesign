; Black Pill STM32F411 — management-plane firmware
; Power + DFU over USB-C; host UART on USART1 → CP2102; SPI1 → Cmod FPGA (bring-up).
; See README.md for jumper tables.

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
; Default: FPGA SPI bring-up (LIVE port0 SPI). Comment the flag (or use uart_mock env) for mock-only.
build_flags =
	-DFPGA_SPI_BRINGUP=1

; UART mock-only (no SPI traffic) — previous stub behavior for GUI demos without Cmod.
[env:blackpill_uart_mock]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
; Intentionally no -DFPGA_SPI_BRINGUP
